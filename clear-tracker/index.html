<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>東方クリア表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@400;500;700;800&family=Outfit:wght@500;600;700;800&display=swap">
<style>
/* Layout: app-style single column. Overview = completion hero + stacked difficulty bars + game cards (each with its own hue ring); detail = hue-washed header + shot×difficulty tile grid + bottom sheet editor */
:root{
  --bg:#f3f4f9; --surface:#ffffff; --surface-2:#eceef6; --ink:#10131f; --muted:#666d86; --line:#e1e4ee;
  --accent:#5856ef; --accent-ink:#ffffff;
  --t1:#dde1f1; --t1-fg:#38405f; --t2:#5856ef; --t3:#cf3f9c; --t4a:#f6b443; --t4b:#ee6a3a; --t4-fg:#2a1405; --on:#ffffff;
  --ok:#1a9e6a; --warn:#d99512; --err:#d94444;
  --ring-track:#e5e7f1; --sat:70%; --lit:54%;
  --shadow:0 1px 2px rgba(16,19,31,.05),0 10px 28px -16px rgba(16,19,31,.18);
  --scrim:rgba(10,12,20,.42);
  --f-ui:"M PLUS 2","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-num:"Outfit","M PLUS 2",system-ui,sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0b11; --surface:#13151e; --surface-2:#1c1f2c; --ink:#eceef7; --muted:#8b91a9; --line:#252a3a;
  --accent:#8a89ff; --accent-ink:#0a0b11;
  --t1:#2a2f46; --t1-fg:#d0d5ef; --t2:#6866ff; --t3:#de56b0; --t4a:#f7bd55; --t4b:#f07b46; --t4-fg:#2a1405; --on:#ffffff;
  --ok:#36c48a; --warn:#f0b33a; --err:#f06464;
  --ring-track:#232739; --sat:72%; --lit:62%;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px -18px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0b11; --surface:#13151e; --surface-2:#1c1f2c; --ink:#eceef7; --muted:#8b91a9; --line:#252a3a;
  --accent:#8a89ff; --accent-ink:#0a0b11;
  --t1:#2a2f46; --t1-fg:#d0d5ef; --t2:#6866ff; --t3:#de56b0; --t4a:#f7bd55; --t4b:#f07b46; --t4-fg:#2a1405; --on:#ffffff;
  --ok:#36c48a; --warn:#f0b33a; --err:#f06464;
  --ring-track:#232739; --sat:72%; --lit:62%;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px -18px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
.foot{font-size:.72rem;color:var(--muted);line-height:1.7;padding-top:8px;border-top:1px solid var(--line)}
.foot a{color:inherit}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em;line-height:1.2}
h2{font-size:1rem;font-weight:800;letter-spacing:.01em}
.eyebrow{font-family:var(--f-num);font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default;opacity:.55}
:is(button,a,input,textarea):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.sec-h h2{white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
/* status pill */
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:.76rem;color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill[data-k="ok"] i{background:var(--ok)} .pill[data-k="busy"] i{background:var(--warn)} .pill[data-k="err"] i{background:var(--err)}
.notice{background:var(--surface-2);border-radius:var(--r-md);padding:10px 14px;font-size:.85rem}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 16px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:.85rem}
.btn:hover:not(:disabled){filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--err);padding-inline:6px}
/* ring */
.ring{--p:0;--c:var(--accent);flex:none;width:var(--sz,56px);height:var(--sz,56px);border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--ring-track) 0)}
.ring>span{width:calc(100% - var(--th,8px));height:calc(100% - var(--th,8px));border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;line-height:1}
/* hero */
.hero{padding:20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.hero .ring{--sz:118px;--th:16px}
.hero .ring>span{font-size:1.7rem;flex-direction:column;gap:2px}
.hero .ring small{font-size:.62rem;color:var(--muted);font-weight:600;letter-spacing:.08em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-num);font-size:1.45rem;font-weight:700;line-height:1.1}
.stat b small{font-size:.75rem;color:var(--muted);font-weight:500}
.stat span{font-size:.74rem;color:var(--muted)}
@media (max-width:480px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.stats{width:100%}}
.bars{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:3.6rem minmax(0,1fr) 4.6rem;gap:12px;align-items:center;font-size:.8rem}
.brow b{font-family:var(--f-num);font-weight:600}
.brow .cnt{text-align:right;color:var(--muted)}
.stack{display:flex;height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.stack i{display:block;height:100%}
.stack .s1{background:var(--t1)} .stack .s2{background:var(--t2)} .stack .s3{background:var(--t3)} .stack .s4{background:linear-gradient(90deg,var(--t4a),var(--t4b))}
/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--surface-2)}
/* tiers */
.t1{background:var(--t1)!important;color:var(--t1-fg)!important}
.t2{background:var(--t2)!important;color:var(--on)!important}
.t3{background:var(--t3)!important;color:var(--on)!important}
.t4{background:linear-gradient(135deg,var(--t4a),var(--t4b))!important;color:var(--t4-fg)!important}
/* game cards */
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.games{grid-template-columns:1fr}}
.gcard{--h:240;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;text-decoration:none;color:inherit;transition:transform .15s ease,box-shadow .15s ease}
.gcard:hover{transform:translateY(-1px)}
.gcard.skip{opacity:.5}
.gcard .ring{--c:hsl(var(--h) var(--sat) var(--lit));--sz:54px;--th:9px}
.gcard .ring>span{font-size:.95rem;color:hsl(var(--h) var(--sat) var(--lit))}
.gcard .ttl{font-weight:800;font-size:1rem;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .sub{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.pips{display:flex;gap:4px}
.pip{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-num);font-size:.6rem;font-weight:700;background:var(--surface-2);color:var(--muted)}
.gcount{font-size:.72rem;color:var(--muted);white-space:nowrap}
/* recent */
.recent{list-style:none;margin:0;padding:6px 0}
.recent li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 18px}
.recent li+li{border-top:1px solid var(--line)}
.recent .what{min-width:0}
.recent .what div{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .what span{font-size:.74rem;color:var(--muted)}
.tag{font-family:var(--f-num);font-size:.7rem;font-weight:700;border-radius:999px;padding:3px 10px}
.empty{padding:18px;font-size:.88rem;color:var(--muted)}
/* data card */
.datacard{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.datacard p{margin:0;font-size:.8rem;color:var(--muted)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.confirm{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:.86rem}
/* detail */
.back{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:8px 14px 8px 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);text-decoration:none;font-size:.85rem;font-weight:700}
.back svg{width:16px;height:16px}
.ghead{--h:240;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;
  background:radial-gradient(130% 160% at 0% 0%,hsl(var(--h) var(--sat) var(--lit) / .22),transparent 58%),var(--surface)}
.ghead h1{font-size:1.7rem}
.ghead .sub{font-size:.82rem;color:var(--muted)}
.ghead .ring{--c:hsl(var(--h) var(--sat) var(--lit));--sz:72px;--th:11px}
.ghead .ring>span{font-size:1.05rem}
.gridcard{padding:14px 12px 12px}
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.m{border-collapse:separate;border-spacing:5px}
table.m th{font-family:var(--f-num);font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em;padding:0 0 2px}
table.m th.shot{font-family:var(--f-ui);text-align:left;font-size:.84rem;color:var(--ink);font-weight:500;letter-spacing:0;padding:0 8px 0 4px;white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1}
td.c{padding:0}
.cell{width:54px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-num);font-size:.74rem;font-weight:700;letter-spacing:.02em;color:var(--muted);position:relative;transition:transform .12s ease}
.cell:hover{transform:scale(1.04)}
.cell:active{transform:scale(.96)}
.cell.t4{box-shadow:0 6px 16px -8px var(--t4b)}
.cell .dot{position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.85}
.subh{font-family:var(--f-num);font-size:.76rem;font-weight:600;letter-spacing:.12em;color:var(--muted);padding:10px 6px 0}
.settings{padding:16px 18px;display:flex;flex-direction:column;gap:14px;font-size:.86rem}
.settings h3{font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:8px}
.optrow{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface-2);font-size:.82rem;cursor:pointer;user-select:none}
.opt input{accent-color:var(--accent);margin:0}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px -10px rgba(0,0,0,.25);
  padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  max-height:90vh;overflow-y:auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet h3{font-size:1.2rem;font-weight:800}
.lbl{font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
.seg{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;background:var(--surface-2);border-radius:var(--r-md);padding:4px;gap:4px}
.seg button{min-height:42px;border-radius:var(--r-sm);font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[aria-checked="true"][data-base="1"]{color:var(--t1-fg)}
.seg button[aria-checked="true"][data-base="2"]{background:var(--t2);color:var(--on)}
.togs{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:8px 14px 8px 10px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:.88rem}
.tog .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.tog .ck svg{width:12px;height:12px;opacity:0}
.tog[aria-pressed="true"] .ck{border-color:transparent;background:var(--accent);color:var(--accent-ink)}
.tog[aria-pressed="true"] .ck svg{opacity:1}
.tog.k3[aria-pressed="true"] .ck{background:var(--t3);color:var(--on)}
.tog.k4[aria-pressed="true"] .ck{background:linear-gradient(135deg,var(--t4a),var(--t4b));color:var(--t4-fg)}
.field{display:flex;flex-direction:column}
.field input,.field textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid transparent;border-radius:var(--r-md);padding:10px 12px;width:100%}
.field input:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.field textarea{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.dates{display:grid;gap:6px}
.drow{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:var(--r-md);padding:4px 4px 4px 14px}
.drow span{flex:1;min-width:0;font-weight:700;font-size:.9rem}
.drow input{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:var(--r-md);padding:8px 10px}
.drow input:focus{border-color:var(--accent);outline:none}
.hint{margin:0;font-size:.8rem;color:var(--muted)}
.lbl small{font-weight:400;letter-spacing:0;margin-left:6px}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s cubic-bezier(.2,.8,.2,1)}
  .scrim{animation:fade .2s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
@media (prefers-reduced-motion:reduce){.gcard,.cell{transition:none}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="top">
    <div>
      <div class="eyebrow">Touhou Project</div>
      <h1>東方クリア表</h1>
    </div>
    <div class="pill" id="status" data-k="busy" aria-live="polite"><i></i><span>読み込み中</span></div>
  </div>
  <div id="view" class="sec" style="gap:20px"></div>
</div>
<div id="sheetRoot"></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>

"no":"15","title":"東方紺珠伝","titleEn":"Legacy of Lunatic Kingdom","year":2015,"hue":216,"difficulties":["E","N","H","L","Ex"],"shots":["霊夢","魔理沙","早苗","鈴仙"],"flags":["完全無欠モード"]},{"id":"th16","no":"16","title":"東方天空璋","titleEn":"Hidden Star in Four Seasons","year":2017,"hue":162,"difficulties":["E","N","H","L","Ex"],"shots":["霊夢(春)","霊夢(夏)","霊夢(秋)","霊夢(冬)","チルノ(春)","チルノ(夏)","チルノ(秋)","チルノ(冬)","文(春)","文(夏)","文(秋)","文(冬)","魔理沙(春)","魔理沙(夏)","魔理沙(秋)","魔理沙(冬)"],"exShots":["霊夢(土用)","チルノ(土用)","文(土用)","魔理沙(土用)"]},{"id":"th17","no":"17","title":"東方鬼形獣","titleEn":"Wily Beast and Weakest Creature","year":2019,"hue":128,"difficulties":["E","N","H","L","Ex"],"shots":["霊夢(狼)","霊夢(獺)","霊夢(鷲)","魔理沙(狼)","魔理沙(獺)","魔理沙(鷲)","妖夢(狼)","妖夢(獺)","妖夢(鷲)"]},{"id":"th18","no":"18","title":"東方虹龍洞","titleEn":"Unconnected Marketeers","year":2021,"hue":300,"difficulties":["E","N","H","L","Ex"],"shots":["霊夢","魔理沙","咲夜","早苗"]},{"id":"th19","no":"19","title":"東方獣王園","titleEn":"Unfinished Dream of All Living Ghost","year":2023,"hue":176,"difficulties":["E","N","H","L","Ex"],"shots":["霊夢","魔理沙","早苗","藍","あうん","ナズーリン","清蘭","燐","典","マミゾウ","八千慧","早鬼","尤魔","萃香","美天","慧ノ子","ちやり","日狭美","残無"]},{"id":"th20","no":"20","title":"東方錦上京","titleEn":"Fossilized Wonders","year":2025,"hue":36,"difficulties":["E","N","H","L","Ex"],"shots":["霊夢","魔理沙"]},{"id":"nc06","no":"NC","title":"東方紅魔郷:New Classic","titleEn":"リメイク版(New Classic版)","year":2026,"remakeOf":"th06","hue":4,"difficulties":["E","N","H","L","Ex"],"shots":["霊夢A","霊夢B","魔理沙A","魔理沙B"]}]}</script>

<script>
(function(){
"use strict";
const DS={E:"E",N:"N",H:"H",L:"L",Ex:"Ex",Ph:"Ph"};
const RAW=JSON.parse(document.getElementById("data-games").textContent);
const DN=RAW.difficultyNames;
const STD=["E","N","H","L","Ex"];
const GAMES=RAW.games.map(g=>({id:g.id,h:g.hue,no:g.no,t:g.title,en:g.titleEn||"",y:g.year,shots:g.shots,exShots:g.exShots,diffs:g.difficulties,flags:g.flags}));
const GI=Object.fromEntries(GAMES.map(g=>[g.id,g]));
const LV=["c","cc","nb","nm","nmnb"];
const CONSTR=[{k:"nb",label:"ノーボム",cls:"k3"},{k:"nm",label:"ノーミス",cls:"k3"},{k:"nmnb",label:"ノーミスノーボム",cls:"k4"}];
const isEx=d=>d==="Ex"||d==="Ph";
const CHECK='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3 5 8.6 9.6 3.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* 保存先: "claude" = Claude のアーティファクト(db), "local" = このブラウザ(localStorage), "none" = 保存不可 */
const IN_CLAUDE=!!(window.claude&&window.claude.use)||window.top!==window.self;
const LOCAL_KEY="touhou-stg-tools:clear-tracker:v1";
let mode=IN_CLAUDE?"claude":"local", db=null, readOnly=false, loaded=!IN_CLAUDE, pendingRestore=null;
const writable=()=>mode==="local"||(mode==="claude"&&!!db&&!readOnly);
const store={}; // gid -> {cells:{}, hidden:{shots:[],diffs:[]}, skip:false}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const emptyDoc=()=>({cells:{},hidden:{shots:[],diffs:[]},skip:false});
function gdoc(gid){if(!store[gid])store[gid]=emptyDoc();const s=store[gid];s.cells=s.cells||{};s.hidden=s.hidden||{shots:[],diffs:[]};s.hidden.shots=s.hidden.shots||[];s.hidden.diffs=s.hidden.diffs||[];return s}
const key=(shot,d)=>shot+"|"+d;
function cell(gid,shot,d){return gdoc(gid).cells[key(shot,d)]||{}}
function tier(c){if(!c)return 0;if(c.nmnb)return 4;if(c.nb||c.nm)return 3;if(c.cc)return 2;if(c.c)return 1;return 0}
function label(c,d){if(c.nmnb)return"NMNB";if(c.nb&&c.nm)return"NB·NM";if(c.nm)return"NM";if(c.nb)return"NB";if(c.cc)return isEx(d)?"Clear":"1cc";if(c.c)return"Clear";return""}
function shotsFor(g,d){return(g.exShots&&isEx(d))?g.exShots:g.shots}
function visDiffs(g){const h=gdoc(g.id).hidden.diffs;return g.diffs.filter(d=>!h.includes(d))}
function visShots(g,d){const h=gdoc(g.id).hidden.shots;return shotsFor(g,d).filter(s=>!h.includes(s))}
const pct=(a,b)=>b?Math.round(a/b*100):0;
/* 達成ごとの日付: c.dates = {c,cc,nb,nm,nmnb,"x:<フラグ名>": "YYYY-MM-DD"}。c.date は最新の達成日(旧形式・CSV・最近の達成用) */
const DL={c:"クリア",cc:"ノーコン",nb:"ノーボム",nm:"ノーミス",nmnb:"ノーミスノーボム"};
function achievedKeys(c){const ks=LV.filter(l=>c[l]);for(const f in c.x||{})if(c.x[f])ks.push("x:"+f);return ks}
function shownKeys(c,d){return achievedKeys(c).filter(k=>!(isEx(d)&&k==="c"))}
function datesOf(c,d){
  if(c.dates&&typeof c.dates==="object"&&!Array.isArray(c.dates))return Object.assign({},c.dates);
  const out={},k=shownKeys(c,d)[0];if(c.date&&k)out[k]=c.date; // 旧形式: 日付は最初の達成に付ける
  return out}
const latest=ds=>Object.values(ds).filter(Boolean).sort().pop();
const dkLabel=(k,d)=>k.startsWith("x:")?k.slice(2):(k==="cc"&&isEx(d)?"クリア":DL[k]);

/* ---------- save queue ---------- */
const dirty=new Set(),writing=new Set(),timers={},retried={};
function status(t,k){const el=$("#status");el.dataset.k=k||"";el.querySelector("span").textContent=t}
function readLocal(){try{const j=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null");return j&&j.games&&typeof j.games==="object"?j.games:{}}catch(_){return null}}
let localTimer=null;
function writeLocal(){clearTimeout(localTimer);status("保存中","busy");localTimer=setTimeout(()=>{
  try{localStorage.setItem(LOCAL_KEY,JSON.stringify({version:1,games:store}));status("この端末に保存済み","ok")}
  catch(_){status("このブラウザには保存できません","err")}},250)}
function save(gid,delay){if(!writable())return;if(mode==="local")return writeLocal();dirty.add(gid);clearTimeout(timers[gid]);status("保存中","busy");timers[gid]=setTimeout(()=>flush(gid),delay??400)}
async function flush(gid){
  if(writing.has(gid)||!dirty.has(gid))return;
  dirty.delete(gid);writing.add(gid);
  try{await db.collection("games").doc(gid).set(clone(gdoc(gid)));retried[gid]=0;if(!dirty.size&&writing.size<=1)status("保存済み","ok")}
  catch(e){
    const code=e&&e.code;
    if(code==="invalid_argument"){readOnly=true;status("閲覧のみ","");render(true)}
    else if(code==="unavailable"&&!retried[gid]){retried[gid]=1;dirty.add(gid);setTimeout(()=>flush(gid),600+Math.random()*900)}
    else if(code==="quota_exceeded"){status("容量の上限です","err")}
    else{status("保存に失敗。もう一度操作してください","err")}
  }finally{writing.delete(gid);if(dirty.has(gid))flush(gid)}
}

/* ---------- overview ---------- */
function bestByDiff(g){const out={};for(const d of g.diffs){let t=0;if(!gdoc(g.id).hidden.diffs.includes(d))for(const s of visShots(g,d))t=Math.max(t,tier(cell(g.id,s,d)));out[d]=t}return out}
function countGame(g){let n=0,done=0,any=0;for(const d of visDiffs(g))for(const s of visShots(g,d)){n++;const t=tier(cell(g.id,s,d));if(t>=2)done++;if(t>0)any++}return{n,done,any}}
function notice(){if(!loaded)return"";
  if(mode==="local")return`<div class="notice">記録はこのブラウザに保存されます。他の端末とは同期しないので、移すときや念のための控えには「バックアップを保存」を使ってください。</div>`;
  if(mode==="none"||!db)return`<div class="notice">この画面では記録を保存できません。表示のみです。</div>`;
  if(readOnly)return`<div class="notice">閲覧のみの権限で開いています。</div>`;return""}
const FOOT=`<footer class="foot">東方Projectの二次創作による非公式ファンツールです。上海アリス幻樂団とは関係ありません。<br>ソースコード: <a href="https://github.com/kuma-ck/touhou-stg-tools" target="_blank" rel="noopener">kuma-ck/touhou-stg-tools</a></footer>`;
function legend(){return`<div class="legend"><span><i></i>未</span><span><i class="t1"></i>クリア</span><span><i class="t2"></i>ノーコン</span><span><i class="t3"></i>NB / NM</span><span><i class="t4"></i>NMNB</span></div>`}
function renderOverview(){
  const agg={};STD.forEach(d=>agg[d]={n:0,t:[0,0,0,0,0]});
  let N=0,D=0,B=0,started=0,active=0;
  for(const g of GAMES){if(gdoc(g.id).skip)continue;active++;const c=countGame(g);if(c.any)started++;
    for(const d of visDiffs(g)){const a=agg[d==="Ph"?"Ex":d];for(const s of visShots(g,d)){const t=tier(cell(g.id,s,d));a.n++;a.t[t]++;N++;if(t>=2)D++;if(t>=3)B++}}}
  const P=pct(D,N);
  const bars=STD.map(d=>{const a=agg[d],w=i=>a.n?(a.t[i]/a.n*100).toFixed(2):0,done=a.t[2]+a.t[3]+a.t[4];
    return`<div class="brow"><b>${DN[d]}</b><div class="stack" role="img" aria-label="${DN[d]} ノーコン以上 ${done}/${a.n}"><i class="s4" style="width:${w(4)}%"></i><i class="s3" style="width:${w(3)}%"></i><i class="s2" style="width:${w(2)}%"></i><i class="s1" style="width:${w(1)}%"></i></div><span class="cnt num">${done} / ${a.n}</span></div>`}).join("");
  const cards=GAMES.map(g=>{const b=bestByDiff(g),c=countGame(g),sk=gdoc(g.id).skip,p=pct(c.done,c.n);
    const pips=g.diffs.map(d=>`<span class="pip t${b[d]}" title="${DN[d]}">${DS[d]}</span>`).join("");
    return`<a class="card gcard${sk?" skip":""}" href="#${g.id}" style="--h:${g.h}"><div class="ring" style="--p:${p}"><span>${esc(g.no)}</span></div><div style="min-width:0"><div class="ttl">${esc(g.t)}</div><div class="sub">${esc(g.en)} · ${g.y}${sk?" · 集計外":""}</div><div class="gmeta"><div class="pips">${pips}</div><span class="gcount num">${c.done}/${c.n}</span></div></div></a>`}).join("");
  const rec=[];for(const g of GAMES){const cs=gdoc(g.id).cells;for(const k in cs){const c=cs[k];if(!c||typeof c!=="object")continue;const i=k.lastIndexOf("|"),s=k.slice(0,i),d=k.slice(i+1);
    if(!c.dates){if(c.date&&tier(c)>0)rec.push({g,s,d,date:c.date,p:c,fl:[],c});continue}
    const by={};for(const q in c.dates){const v=c.dates[q];if(v)(by[v]=by[v]||[]).push(q)}
    for(const date in by){const p={},fl=[];for(const q of by[date]){if(q.startsWith("x:"))fl.push(q.slice(2));else p[q]=true}rec.push({g,s,d,date,p,fl,c})}}}
  rec.sort((a,b)=>b.date.localeCompare(a.date));
  const recent=rec.length?`<ul class="recent">${rec.slice(0,6).map(r=>{const t=tier(r.p);return`<li><div class="what"><div>${esc(r.g.t.replace("東方",""))} · ${esc(r.s)}${r.fl.length?" · "+esc(r.fl.join("・")):""}</div><span class="num">${DN[r.d]||esc(r.d)} · ${esc(r.date)}</span></div><span class="tag t${t||tier(r.c)}">${t?label(r.p,r.d):esc(r.fl.join("・"))}</span></li>`}).join("")}</ul>`
    :`<div class="empty">作品を開いてマスをタップすると記録できます。達成した記録がここに新しい順で並びます。</div>`;
  const confirm=pendingRestore?`<div class="confirm" role="alert"><div><b>${esc(pendingRestore.when)}</b> のバックアップ(${pendingRestore.n}作品分)で、今の記録をすべて置き換えます。</div><div class="row-btns"><button type="button" class="btn primary" id="doRestore">置き換える</button><button type="button" class="btn" id="cancelRestore">やめる</button></div></div>`:"";
  $("#view").innerHTML=`
  ${notice()}
  <section class="card hero"><div class="ring" style="--p:${P};--c:var(--accent)"><span class="num">${P}%<small>NO CONTINUE</small></span></div>
    <div class="stats"><div class="stat"><b class="num">${D}<small> / ${N}</small></b><span>ノーコン以上</span></div><div class="stat"><b class="num">${B}</b><span>縛り達成</span></div><div class="stat"><b class="num">${started}<small> / ${active}</small></b><span>着手した作品</span></div></div></section>
  <section class="sec"><div class="sec-h"><h2>難易度別</h2>${legend()}</div><div class="card bars">${bars}</div></section>
  <section class="sec"><div class="sec-h"><h2>作品</h2><span class="muted" style="font-size:.74rem">リングはノーコン以上の割合</span></div><div class="games">${cards}</div></section>
  <section class="sec"><h2>最近の達成</h2><div class="card">${recent}</div></section>
  <section class="sec"><h2>データ</h2><div class="card datacard">
    <p>バックアップは全記録を1つのファイルに保存します。同じファイルから復元できます。CSVはPythonなどでの集計用です。</p>
    <div class="row-btns"><button type="button" class="btn" id="bkBtn">バックアップを保存</button>${!writable()?"":`<button type="button" class="btn" id="rsBtn">バックアップから復元</button>`}<button type="button" class="btn" id="csvBtn">CSVで書き出す</button></div>
    ${confirm}</div></section>
  ${FOOT}`;
}

/* ---------- detail ---------- */
let showSettings=false;
function matrix(g,diffs,shots){
  if(!diffs.length||!shots.length)return"";
  const head=`<tr><th></th>${diffs.map(d=>`<th scope="col">${DS[d]}</th>`).join("")}</tr>`;
  const body=shots.map(s=>`<tr><th class="shot" scope="row">${esc(s)}</th>${diffs.map(d=>{const c=cell(g.id,s,d),t=tier(c);const extra=(g.flags||[]).some(f=>c.x&&c.x[f])||c.note;
    return`<td class="c"><button type="button" class="cell${t?" t"+t:""}" data-s="${esc(s)}" data-d="${d}" aria-label="${esc(s)} ${DN[d]} ${label(c,d)||"未"}">${label(c,d)}${extra?'<span class="dot"></span>':""}</button></td>`}).join("")}</tr>`).join("");
  return`<div class="gridwrap"><table class="m">${head}${body}</table></div>`;
}
function renderGame(g){
  const s=gdoc(g.id),c=countGame(g),p=pct(c.done,c.n);
  let grids;
  if(g.exShots){const main=visDiffs(g).filter(d=>!isEx(d)),ex=visDiffs(g).filter(isEx);
    grids=matrix(g,main,visShots(g,"E"))+(ex.length?`<div class="subh">EXTRA</div>`+matrix(g,ex,visShots(g,"Ex")):"");}
  else grids=matrix(g,visDiffs(g),visShots(g,"E"));
  const allShots=[...g.shots,...(g.exShots||[])];
  const dis=writable()?"":"disabled";
  const settings=showSettings?`<div class="card settings">
    <div><h3>表示する難易度</h3><div class="optrow">${g.diffs.map(d=>`<label class="opt"><input type="checkbox" id="hd-${d}" data-hd="${d}" ${s.hidden.diffs.includes(d)?"":"checked"} ${dis}>${DN[d]}</label>`).join("")}</div></div>
    <div><h3>表示する機体</h3><div class="optrow">${allShots.map((v,i)=>`<label class="opt"><input type="checkbox" id="hs-${i}" data-hs="${esc(v)}" ${s.hidden.shots.includes(v)?"":"checked"} ${dis}>${esc(v)}</label>`).join("")}</div></div>
    <label class="opt" style="align-self:flex-start"><input type="checkbox" id="skipG" ${s.skip?"checked":""} ${dis}>この作品を全体の集計から外す</label></div>`:"";
  $("#view").innerHTML=`
  <a class="back" href="#"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>作品一覧</a>
  ${notice()}
  <section class="card ghead" style="--h:${g.h}"><div style="min-width:0"><div class="eyebrow">No.${esc(g.no)} · ${g.y}</div><h1>${esc(g.t)}</h1><div class="sub">${esc(g.en)}</div><div class="sub num" style="margin-top:6px">ノーコン以上 ${c.done} / ${c.n}</div></div><div class="ring" style="--p:${p}"><span class="num">${p}%</span></div></section>
  ${legend()}
  <section class="card gridcard">${grids||'<div class="empty">表示する機体か難易度がありません。表示設定で選び直してください。</div>'}</section>
  ${g.flags?`<p class="muted" style="margin:0;font-size:.78rem">右上の点は「${esc(g.flags.join("・"))}」やメモが付いたマスです。</p>`:""}
  <div class="row-btns"><button class="btn" type="button" id="setBtn" aria-expanded="${showSettings}">${showSettings?"表示設定を閉じる":"表示設定"}</button></div>
  ${settings}
  ${FOOT}`;
}

/* ---------- sheet ---------- */
let cur=null;
const baseOf=c=>c.cc?2:c.c?1:0;
function openSheet(gid,s,d){cur={gid,s,d};renderSheet()}
function closeSheet(){cur=null;$("#sheetRoot").innerHTML="";render(true)}
function renderSheet(){
  if(!cur){$("#sheetRoot").innerHTML="";return}
  const g=GI[cur.gid],c=cell(cur.gid,cur.s,cur.d),ex=isEx(cur.d),dis=writable()?"":"disabled";
  const opts=ex?[[0,"未"],[2,"クリア"]]:[[0,"未"],[1,"クリア"],[2,"ノーコン"]];
  const seg=opts.map(([v,l])=>`<button type="button" role="radio" data-base="${v}" aria-checked="${baseOf(c)===v}" ${dis}>${l}</button>`).join("");
  const tog=(attr,k,l,cls,on)=>`<button type="button" class="tog ${cls}" ${attr}="${esc(k)}" aria-pressed="${on}" ${dis}><span class="ck">${CHECK}</span>${esc(l)}</button>`;
  const cons=CONSTR.map(o=>tog("data-lv",o.k,o.label,o.cls,!!c[o.k])).join("");
  const fl=(g.flags||[]).map(f=>tog("data-fl",f,f,"",!!(c.x&&c.x[f]))).join("");
  $("#sheetRoot").innerHTML=`<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" style="--h:${g.h}"><div class="grab"></div><div class="sheet-in">
    <div><div class="eyebrow">${esc(g.t.replace("東方",""))} · ${DN[cur.d]}</div><h3 id="shT">${esc(cur.s)}</h3></div>
    <div><div class="lbl">到達</div><div class="seg" role="radiogroup" aria-label="到達">${seg}</div></div>
    <div><div class="lbl">縛り</div><div class="togs">${cons}</div></div>
    ${fl?`<div><div class="lbl">ルート・モード</div><div class="togs">${fl}</div></div>`:""}
    <div class="two"><div><div class="lbl">達成日</div><div class="dates" id="dateRows" data-sig="${esc(dateSig(c))}">${dateRows(c,cur.d,dis)}</div></div>
    <label class="field" for="fNote"><span class="lbl">メモ<small>書き始めると今日の日付が入ります</small></span><textarea id="fNote" placeholder="スコア、残機、リプレイの保存場所など" ${dis}>${esc(c.note||"")}</textarea></label></div>
    <div class="sheet-foot"><button type="button" class="btn danger" id="clrCell" ${dis}>このマスを消去</button><button type="button" class="btn primary" id="closeSheet">完了</button></div>
  </div></div>`;
}
function dateRows(c,d,dis){const ds=datesOf(c,d),ks=shownKeys(c,d);
  if(!ks.length)return`<p class="hint">到達や縛りを選ぶと、その日の日付が入ります。</p>`;
  return ks.map(k=>`<label class="drow"><span>${esc(dkLabel(k,d))}</span><input type="date" data-dk="${esc(k)}" value="${esc(ds[k]||"")}" aria-label="${esc(dkLabel(k,d))}の達成日" ${dis}></label>`).join("")}
const dateSig=c=>JSON.stringify([cur.d,shownKeys(c,cur.d),datesOf(c,cur.d),writable()]);
function syncSheet(){
  if(!cur)return;const root=$("#sheetRoot");if(!root.firstElementChild)return renderSheet();
  const c=cell(cur.gid,cur.s,cur.d),dis=!writable(),b=baseOf(c);
  root.querySelectorAll("[data-base]").forEach(el=>el.setAttribute("aria-checked",String(+el.dataset.base===b)));
  root.querySelectorAll("[data-lv]").forEach(el=>el.setAttribute("aria-pressed",String(!!c[el.dataset.lv])));
  root.querySelectorAll("[data-fl]").forEach(el=>el.setAttribute("aria-pressed",String(!!(c.x&&c.x[el.dataset.fl]))));
  const dr=$("#dateRows"),fn=$("#fNote"),sig=dateSig(c);
  if(dr&&dr.dataset.sig!==sig&&!dr.contains(document.activeElement)){dr.innerHTML=dateRows(c,cur.d,dis?"disabled":"");dr.dataset.sig=sig}
  if(fn&&document.activeElement!==fn&&fn.value!==(c.note||""))fn.value=c.note||"";
  root.querySelectorAll("[data-base],[data-lv],[data-fl],[data-dk],#fNote,#clrCell").forEach(el=>{el.disabled=dis});
}
const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(q=>[q,v[q]])):v);
function mutate(fn){const s=gdoc(cur.gid),k=key(cur.s,cur.d);const c=Object.assign({},s.cells[k]||{});
  const before=new Set(achievedKeys(c)),orphan=!c.dates&&!!c.date&&!before.size;
  c.dates=datesOf(c,cur.d);fn(c);
  for(const l of LV)if(!c[l])delete c[l];
  const now=achievedKeys(c),t=today();
  for(const q of now)if(!before.has(q))c.dates[q]=t; // 新しく達成した項目に今日の日付
  for(const q in c.dates)if(!now.includes(q)||!c.dates[q])delete c.dates[q];
  const last=latest(c.dates);if(last)c.date=last;else if(!orphan)delete c.date;
  if(!Object.keys(c.dates).length)delete c.dates;
  const empty=!tier(c)&&!c.note&&!c.date&&!(c.x&&Object.values(c.x).some(Boolean));
  if(empty)delete s.cells[k];else s.cells[k]=c;save(cur.gid)}
function setBase(n){mutate(c=>{
  if(n===0){for(const l of LV)delete c[l]}
  else if(n===1){c.c=true;delete c.cc;delete c.nb;delete c.nm;delete c.nmnb}
  else{c.c=true;c.cc=true}});syncSheet();render(true)}
function toggleLevel(k){mutate(c=>{
  if(!c[k]){c[k]=true;if(k==="nmnb"){c.nb=c.nm=true}c.cc=c.c=true}
  else{delete c[k];if(k==="nb"||k==="nm")delete c.nmnb}});syncSheet();render(true)}

/* ---------- files ---------- */
async function offer(filename,data,okMsg){
  if(!IN_CLAUDE){
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:filename.endsWith(".csv")?"text/csv":"application/json"}));
    a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status(okMsg,"ok");return}
  const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
  if(!dl){status("この画面では保存できません","err");return}
  try{await dl.save({filename,data});status(okMsg,"ok")}
  catch(e){if(e&&e.code==="declined")return;status(e&&e.code==="rate_limited"?"少し待って再実行してください":"ファイルを保存できませんでした","err")}
}
function exportCsv(){
  const q=v=>{v=String(v??"");return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[["game_id","game","release_year","shot","difficulty","clear","no_continue","no_bomb","no_miss","no_miss_no_bomb","flags","date","note","clear_date","no_continue_date","no_bomb_date","no_miss_date","no_miss_no_bomb_date","flag_dates"].join(",")];
  for(const g of GAMES)for(const d of g.diffs)for(const s of shotsFor(g,d)){const c=cell(g.id,s,d),ds=datesOf(c,d);
    lines.push([g.id,g.t,g.y,s,DN[d],c.c?1:0,c.cc?1:0,c.nb?1:0,c.nm?1:0,c.nmnb?1:0,Object.keys(c.x||{}).filter(f=>c.x[f]).join(";"),c.date||"",c.note||"",...LV.map(l=>ds[l]||""),Object.keys(ds).filter(k=>k.startsWith("x:")).map(k=>k.slice(2)+"="+ds[k]).join(";")].map(q).join(","))}
  offer("touhou_clear_"+today()+".csv","\uFEFF"+lines.join("\n"),"CSVを書き出しました");
}
function exportBackup(){
  const games={};for(const g of GAMES)if(store[g.id])games[g.id]=clone(gdoc(g.id));
  offer("touhou_clear_backup_"+today()+".json",JSON.stringify({app:"touhou-clear",version:1,exportedAt:new Date().toISOString(),games},null,1),"バックアップを保存しました");
}
function sanitize(d){
  const out=emptyDoc();if(!d||typeof d!=="object")return out;
  if(d.cells&&typeof d.cells==="object"&&!Array.isArray(d.cells))for(const k in d.cells){const c=d.cells[k];if(c&&typeof c==="object"&&!Array.isArray(c))out.cells[String(k)]=JSON.parse(JSON.stringify(c))}
  if(d.hidden){if(Array.isArray(d.hidden.shots))out.hidden.shots=d.hidden.shots.map(String);if(Array.isArray(d.hidden.diffs))out.hidden.diffs=d.hidden.diffs.map(String)}
  out.skip=!!d.skip;return out;
}
function readRestore(file){
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||j.app!=="touhou-clear"||!j.games||typeof j.games!=="object")throw 0;
      const n=Object.keys(j.games).filter(k=>GI[k]).length;
      const when=j.exportedAt?new Date(j.exportedAt).toLocaleString("ja-JP",{dateStyle:"medium",timeStyle:"short"}):file.name;
      pendingRestore={games:j.games,n,when};render(true)}
    catch(_){status("このファイルはクリア表のバックアップではありません","err")}};
  r.onerror=()=>status("ファイルを読み込めませんでした","err");
  r.readAsText(file);
}
function doRestore(){
  if(!pendingRestore||!writable())return;
  for(const g of GAMES){store[g.id]=sanitize(pendingRestore.games[g.id]);save(g.id,0)}
  pendingRestore=null;render(true);
}

/* ---------- routing & events ---------- */
function render(keepScroll){const g=GI[location.hash.slice(1)];const y=window.scrollY;if(g)renderGame(g);else renderOverview();if(keepScroll)window.scrollTo(0,y)}
window.addEventListener("hashchange",()=>{showSettings=false;cur=null;$("#sheetRoot").innerHTML="";render();window.scrollTo(0,0)});
document.addEventListener("click",e=>{
  const t=e.target.closest("button,#scrim");if(!t)return;
  if(t.id==="scrim"||t.id==="closeSheet")return closeSheet();
  if(t.id==="csvBtn")return exportCsv();
  if(t.id==="bkBtn")return exportBackup();
  if(t.id==="rsBtn"){const f=$("#restoreFile");f.value="";return f.click()}
  if(t.id==="doRestore")return doRestore();
  if(t.id==="cancelRestore"){pendingRestore=null;return render(true)}
  if(t.id==="setBtn"){showSettings=!showSettings;return render(true)}
  if(t.classList.contains("cell")){const g=GI[location.hash.slice(1)];if(g)openSheet(g.id,t.dataset.s,t.dataset.d);return}
  if(!cur)return;
  if(t.dataset.base!==undefined)return setBase(+t.dataset.base);
  if(t.dataset.lv)return toggleLevel(t.dataset.lv);
  if(t.dataset.fl){const f=t.dataset.fl;mutate(c=>{c.x=Object.assign({},c.x||{});if(c.x[f])delete c.x[f];else c.x[f]=true;if(!Object.keys(c.x).length)delete c.x});syncSheet();return render(true)}
  if(t.id==="clrCell"){const s=gdoc(cur.gid);delete s.cells[key(cur.s,cur.d)];save(cur.gid,0);syncSheet();return render(true)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&cur)closeSheet()});
document.addEventListener("input",e=>{
  if(!cur)return;
  if(e.target.id==="fNote"){const v=e.target.value;mutate(c=>{if(v)c.note=v;else delete c.note})}
  if(e.target.dataset.dk){const q=e.target.dataset.dk,v=e.target.value;mutate(c=>{if(v)c.dates[q]=v;else delete c.dates[q]});render(true)}
});
/* メモ: 書き始めるときに今日の日付を行頭に入れる。何も書かずに離れたら取り消す */
const stamp=()=>today().replace(/-/g,"/");
document.addEventListener("focusin",e=>{
  const t=e.target;if(t.id!=="fNote"||!cur||t.disabled)return;
  const v=t.value;if(v.split("\n").some(l=>l.startsWith(stamp())))return;
  const body=v.replace(/\s+$/,""),nv=(body?body+"\n":"")+stamp()+" ";
  t.value=nv;t.dataset.auto=nv;
  setTimeout(()=>{if(document.activeElement===t&&t.value===nv){t.setSelectionRange(nv.length,nv.length);t.scrollTop=t.scrollHeight}},0);
});
document.addEventListener("focusout",e=>{
  const t=e.target;if(t.id!=="fNote"||t.dataset.auto===undefined)return;
  if(t.value===t.dataset.auto)t.value=cur?cell(cur.gid,cur.s,cur.d).note||"":"";
  delete t.dataset.auto;
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="restoreFile"){if(t.files&&t.files[0])readRestore(t.files[0]);return}
  const g=GI[location.hash.slice(1)];if(!g||!writable())return;const s=gdoc(g.id);
  if(t.dataset.hd){const d=t.dataset.hd;s.hidden.diffs=t.checked?s.hidden.diffs.filter(v=>v!==d):[...s.hidden.diffs,d];save(g.id);render(true)}
  else if(t.dataset.hs){const v=t.dataset.hs;s.hidden.shots=t.checked?s.hidden.shots.filter(z=>z!==v):[...s.hidden.shots,v];save(g.id);render(true)}
  else if(t.id==="skipG"){s.skip=t.checked;save(g.id);render(true)}
});

/* ---------- startup ---------- */
if(mode==="local"){
  const saved=readLocal();
  if(saved===null){mode="none";status("保存できません","err")}
  else{Object.assign(store,saved);status("この端末に保存済み","ok")}
  window.addEventListener("storage",e=>{if(e.key!==LOCAL_KEY)return;const s=readLocal();if(!s)return;
    for(const k of Object.keys(store))delete store[k];Object.assign(store,s);render(true);syncSheet()});
}
render();

if(mode==="claude")(async()=>{
  const c=window.claude;
  db=c&&c.use?await c.use("db"):null;
  const user=c&&c.use?await c.use("user"):null;
  loaded=true;
  if(!db){mode="none";status("表示のみ","");render(true);return}
  try{if(user&&user.can){const ok=await user.can("data.write");if(ok===false)readOnly=true}}catch(_){}
  render(true);
  db.collection("games").onSnapshot(snap=>{
    let changed=false;
    for(const d of snap.docs){if(dirty.has(d.id)||writing.has(d.id)||!d.exists)continue;const nv=stable(d.data());if(stable(store[d.id]??null)!==nv){store[d.id]=JSON.parse(nv);changed=true}}
    for(const ch of snap.docChanges())if(ch.type==="removed"&&!dirty.has(ch.doc.id)&&!writing.has(ch.doc.id)&&store[ch.doc.id]){delete store[ch.doc.id];changed=true}
    if(!dirty.size&&!writing.size)status(readOnly?"閲覧のみ":"同期済み",readOnly?"":"ok");
    if(changed){render(true);syncSheet()}
  },err=>{status(err&&err.code==="revoked"?"表示のみ":"同期が停止。再読み込みしてください",err&&err.code==="revoked"?"":"err")});
})();
})();
</script>
</body>
